<text x="720" y="80" font-size="36" font-weight="700" text-anchor="middle" fill="#16364b">Projects</text>
<text x="720" y="119" font-size="26" font-weight="400" text-anchor="middle" fill="#40596b">Active goals</text>
<text x="1072" y="447" font-size="36" font-weight="700" text-anchor="start" fill="#16364b">Areas</text>
<text x="1072" y="486" font-size="26" font-weight="400" text-anchor="start" fill="#40596b">Ongoing responsibilities</text>
