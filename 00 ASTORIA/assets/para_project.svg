<text x="720" y="860" font-size="26" font-weight="400" text-anchor="middle" fill="#40596b">Reusable references</text>
<text x="368" y="447" font-size="36" font-weight="700" text-anchor="end" fill="#16364b">Archive</text>
<text x="368" y="486" font-size="26" font-weight="400" text-anchor="end" fill="#40596b">Inactive material</text>
