<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title description">
<title id="title">Four ways to organize your work</title>
<desc id="description">Four separate ring segments surround Your work. Projects holds active goals. Areas covers ongoing responsibilities. Resources holds reusable references. Archive holds inactive material.</desc>
<metadata>Original ASTORIA draft vector composition. Blue, teal, gold and coral follow the existing five-layer overview palette. No external artwork is used.</metadata>
