<path d="M893.69 674.49 A276 276 0 0 1 546.31 674.49 L602.95 604.55 A186 186 0 0 0 837.05 604.55 Z" fill="#d9a03f"/>
<path d="M505.51 633.69 A276 276 0 0 1 505.51 286.31 L575.45 342.95 A186 186 0 0 0 575.45 577.05 Z" fill="#cb625a"/>
