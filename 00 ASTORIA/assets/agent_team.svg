<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title description">
<title id="title">A coordinated ASTORIA workflow</title>
<desc id="description">Your question reaches a Companion, which frames the task. A Coordinator assigns focused work to four example skills: paper-search, research-summarizer, prediction-stress-test and research-critique. Their results return through the Coordinator to the Companion for checking and synthesis. These are examples of specialist functions, not a mandatory sequence.</desc>
