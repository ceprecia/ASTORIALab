<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#0f7183"/></marker></defs>
<rect width="1440" height="900" fill="white"/>
<metadata>ASTORIA native SVG diagram, composed with AI assistance. Assistant names are plain typeset labels in original muted-color boxes; no provider artwork is embedded. Updated 2026-11-02.</metadata>
