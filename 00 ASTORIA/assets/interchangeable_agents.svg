<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Switch assistant tools around the same saved files</title>
<desc id="description">The same core holds me.md, saved project context, sources, skills and maps. Layer 4 shows assistant choices as plain text labels: ChatGPT / Codex, Claude and Hermes Agent. Arrows show switching the assistant while retaining the files. Layer 5 is the optional extensions ring. Continuing work requires suitable access to saved project files; unsaved chat state is not transferred and integrations are not certified.</desc>
